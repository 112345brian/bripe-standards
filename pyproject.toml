[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bripe-standards"
version = "1.0.0"
description = "Local conformance checks for the Bripe engineering standards contract."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bri" }]
classifiers = ["Programming Language :: Python :: 3"]

[project.scripts]
bripe-standards = "bripe_standards.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bripe_standards"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]
